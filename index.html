<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CineShelf — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body data-page="index" class="min-h-screen bg-zinc-900 text-zinc-100">
    <div class="max-w-5xl mx-auto">
      <nav class="sticky top-0 z-50 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex-shrink-0 inline-flex items-center">
              <img src="assets/CineShelfLogo.png" alt="CineShelf" class="h-12 w-auto object-contain">
            </a>
          <div class="flex items-center space-x-4">
            <a href="index.html" class="text-zinc-200 hover:text-emerald-300">Dashboard</a>
            <a href="diary.html" class="text-zinc-200 hover:text-emerald-300">Diary</a>
          </div>
        </div>
      </nav>
      <div class="p-6">

      <section class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-zinc-800 p-4 rounded-lg shadow-sm">
          <div class="text-sm text-zinc-400">Total</div>
          <div id="statTotal" class="text-2xl font-bold text-emerald-300">0</div>
        </div>
        <div class="bg-zinc-800 p-4 rounded-lg shadow-sm">
          <div class="text-sm text-zinc-400">Watched</div>
          <div id="statWatched" class="text-2xl font-bold text-emerald-300">0</div>
        </div>
        <div class="bg-zinc-800 p-4 rounded-lg shadow-sm">
          <div class="text-sm text-zinc-400">Unwatched</div>
          <div id="statUnwatched" class="text-2xl font-bold text-emerald-300">0</div>
        </div>
      </section>

      <section class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="flex-1">
          <input id="search" type="search" placeholder="Search title or notes..." class="w-full md:w-96 px-3 py-2 rounded bg-zinc-800 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
        </div>
        <div class="flex items-center gap-3">
          <select id="filterWatched" class="px-3 py-2 rounded bg-zinc-800 border border-zinc-700">
            <option value="all">All</option>
            <option value="watched">Watched</option>
            <option value="unwatched">Unwatched</option>
          </select>
          <button id="clearBtn" class="px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-zinc-900">Clear All</button>
        </div>
      </section>

      <section class="mb-6">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-medium mb-3 text-zinc-200">Recent Entries</h2>
          <a href="form.html" class="inline-flex items-center px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-zinc-900 rounded">+ Add a Movie</a>
        </div>

        <div id="carousel" class="mt-2 flex space-x-4 overflow-x-auto py-2"></div>
      </section>

      <section>
        <div id="list" class="space-y-3"></div>
      </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center">
      <div class="absolute inset-0 bg-black/60" id="modalOverlay"></div>
      <div class="relative bg-zinc-900 rounded-lg max-w-3xl w-full mx-4 shadow-lg p-6 z-10">
        <button id="modalClose" class="absolute right-3 top-3 text-zinc-300 hover:text-zinc-100">✕</button>
        <div id="modalContent" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-1">
            <img id="modalPoster" src="" alt="poster" class="w-full h-64 object-cover rounded bg-zinc-800" />
          </div>
          <div class="md:col-span-2">
            <h3 id="modalTitle" class="text-xl font-semibold text-emerald-300"></h3>
            <div id="modalMeta" class="text-sm text-zinc-400 mt-1"></div>
            <div id="modalRating" class="mt-3"></div>
            <div id="modalNotes" class="mt-4 text-zinc-200"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
